name: Build, Test, and Container Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Cancel in-progress runs on the same branch when new pushes arrive
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # JOB 1: Build & Test the .NET Application
  # -------------------------------------------------------------
  dotnet-build-test:
    name: Build & Run Unit Tests (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Matches your target framework

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

  # -------------------------------------------------------------
  # JOB 2: Verify Docker Container Build & Layer Caching
  # -------------------------------------------------------------
  docker-build-check:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: dotnet-build-test # Ensures tests pass before attempting Docker build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false # Only builds to ensure Dockerfile compliance without pushing to a registry
          tags: blazor-rag-assistant:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max